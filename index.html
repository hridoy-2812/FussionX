    /* ================================================================
       BLOCKCHAIN SECURE RECORD MANAGEMENT TAB & TAMPER SIMULATOR
    ================================================================ */
    function BlockchainTab({ t }) {
        const [records, setRecords] = useState([]);
        const [loading, setLoading] = useState(false);
        const [batchId, setBatchId] = useState(`BATCH-${Date.now().toString().slice(-6)}`);
        const [cropName, setCropName] = useState("Organic Basmati Rice");
        const [soilPh, setSoilPh] = useState(6.8);
        const [moisture, setMoisture] = useState(42.0);
        const [temperature, setTemperature] = useState(26.5);
        const [anchorSuccess, setAnchorSuccess] = useState(null);

        // Verification & Tamper Simulation State
        const [selectedBatch, setSelectedBatch] = useState(null);
        const [tamperedPh, setTamperedPh] = useState(7.9);
        const [verifyResult, setVerifyResult] = useState(null);
        const [verifying, setVerifying] = useState(false);

        const fetchRecords = useCallback(async () => {
            try {
                const res = await fetch("/api/blockchain/records");
                const data = await res.json();
                setRecords(data.reverse());
                if (data.length > 0 && !selectedBatch) {
                    setSelectedBatch(data[0]);
                }
            } catch (err) {
                console.error("Failed to load blockchain ledger:", err);
            }
        }, [selectedBatch]);

        useEffect(() => { fetchRecords(); }, [fetchRecords]);

        const handleAnchor = async (e) => {
            e.preventDefault();
            setLoading(true);
            const payload = {
                batch_id: batchId,
                crop_name: cropName,
                soil_ph: parseFloat(soilPh),
                moisture: parseFloat(moisture),
                temperature: parseFloat(temperature),
                location: "West Bengal, India"
            };

    function CommunityTab({ role, t }) {

        const load = useCallback(async () => {
            try {
                const res = await fetch("/api/forum");
                const data = await res.json();
                setPosts(data.reverse());
            } catch (e) { console.error(e); }
        }, []);

        useEffect(() => { load(); }, [load]);

        const handlePost = async () => {
            if (!question.trim()) return;
            setPosting(true);
            try {
                await fetch("/api/forum", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question, user_role: role }),
                });
                setQuestion("");
                await load();
            } catch (e) { console.error(e); }
            setPosting(false);

        const roleColors = {
            Farmer: "bg-green-500/10 text-green-400 border-green-500/30",
            Admin: "bg-blue-500/10 text-blue-400 border-blue-500/30",
            Retailer: "bg-amber-500/10 text-amber-400 border-amber-500/30",

        return (
            <div className="animate-fade-in space-y-6">

        ]);
        const [input, setInput] = useState("");
        const [sending, setSending] = useState(false);
        const bottomRef = useRef(null);

        useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

        const handleSend = async () => {
            if (!input.trim() || sending) return;
            const userMsg = input.trim();
            setInput("");
            setMessages(prev => [...prev, { role: "user", text: userMsg }]);
            setSending(true);
            try {
                const res = await fetch("/api/chat", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: userMsg, api_key: apiKey }),
                });
                const data = await res.json();
                setMessages(prev => [...prev, { role: "bot", text: data.reply, source: data.source }]);
            } catch (e) {
                setMessages(prev => [...prev, { role: "bot", text: "Sorry, could not reach the server." }]);
            }
            setSending(false);

            <>

                    <div className="fixed bottom-24 right-6 z-50 w-96 max-w-[calc(100vw-3rem)] glass-strong rounded-2xl flex flex-col animate-slide-up shadow-2xl"
                        style={{ height: '28rem' }}>

                            <h4 className="font-bold text-sm gradient-text flex-1">{t.chatTitle}</h4>
                            {apiKey && <span className="text-[10px] px-2 py-0.5 rounded-full bg-agri-900/60 border border-agri-700 text-agri-400">Gemini</span>}
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {messages.map((m, i) => (
                                <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'} chat-pop`}>
                                    <div className={`max-w-[80%] px-4 py-2.5 rounded-2xl text-sm leading-relaxed
                                        ${m.role === 'user'
                                            ? 'bg-agri-600 text-white rounded-br-md'
                                            : 'bg-surface-800 text-gray-200 rounded-bl-md border border-gray-700/50'}`}>
                                        {m.text}
                                        {m.source === 'expert' && <span className="block text-[10px] text-gray-500 mt-1">— Expert Farmer</span>}
                                    </div>
                                </div>
                            ))}
                            {sending && (
                                <div className="flex justify-start chat-pop">
                                    <div className="bg-surface-800 border border-gray-700/50 px-4 py-3 rounded-2xl rounded-bl-md">
                                        <div className="flex gap-1">
                                            <span className="w-2 h-2 bg-agri-500 rounded-full animate-bounce" style={{animationDelay:'0ms'}}></span>
                                            <span className="w-2 h-2 bg-agri-500 rounded-full animate-bounce" style={{animationDelay:'150ms'}}></span>
                                            <span className="w-2 h-2 bg-agri-500 rounded-full animate-bounce" style={{animationDelay:'300ms'}}></span>
                                        </div>
                                    </div>
                                </div>
                            )}
                            <div ref={bottomRef}></div>
                        </div>

                        <div className="p-3 border-t border-white/10">
                            <div className="flex gap-2">
                                <input type="text" value={input} onChange={e => setInput(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && handleSend()}
                                    className="flex-1 bg-surface-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-agri-500 transition"
                                    placeholder={t.chatPlaceholder} />
                                <button onClick={handleSend} disabled={sending || !input.trim()}
                                    className="bg-agri-600 hover:bg-agri-500 disabled:opacity-40 rounded-xl px-4 py-2.5 text-sm font-semibold transition">
                                    {t.send}
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </>
        );
    }

    /* ================================================================
       FARMER DASHBOARD
    ================================================================ */

        ];

        return (
            <div className="max-w-6xl mx-auto p-6 animate-fade-in">
                <h2 className="text-2xl font-bold mb-6">{t.welcome}, <span className="gradient-text">{t[role.toLowerCase()]}</span> 👋</h2>

                <div className="flex gap-2 mb-6 bg-surface-800 rounded-xl p-1.5 w-fit flex-wrap">
                    {tabs.map(tb => (

                            className={`flex items-center gap-2 px-5 py-2.5 rounded-lg text-sm font-medium transition-all

    /* ================================================================

    ================================================================ */

            fetch("/api/forum").then(r => r.json()).then(d => setPosts(d)).catch(console.error);
            fetch("/api/blockchain/records").then(r => r.json()).then(d => setRecords(d)).catch(console.error);

            <div className="max-w-6xl mx-auto p-6 animate-fade-in space-y-6">

                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    {[
                        { label: "Total Posts", value: posts.length, icon: "📝", color: "from-blue-500/20 to-cyan-500/20 border-blue-500/30" },
                        { label: "Farmers", value: posts.filter(p => p.user_role === "Farmer").length, icon: "🌾", color: "from-green-500/20 to-emerald-500/20 border-green-500/30" },
                        { label: "Retailers", value: posts.filter(p => p.user_role === "Retailer").length, icon: "🛒", color: "from-amber-500/20 to-orange-500/20 border-amber-500/30" },
                        { label: "Anchored Batches", value: records.length, icon: "⛓️", color: "from-purple-500/20 to-violet-500/20 border-purple-500/30" },

                            <div className="text-3xl mb-2">{c.icon}</div>

                            <p className="text-4xl font-black mt-1">{c.value}</p>

                </div>

                <div className="glass rounded-2xl p-6">
                    <h3 className="font-bold mb-4 gradient-text">Recent Ledger Activity</h3>
                    <div className="space-y-2 font-mono text-xs">
                        {records.slice(0, 5).map((r, i) => (
                            <div key={i} className="flex justify-between items-center bg-surface-800 rounded-xl px-4 py-3">
                                <div>
                                    <span className="text-agri-400 font-bold mr-3">{r.batch_id}</span>
                                    <span className="text-gray-300">{r.crop_name}</span>

    /* ================================================================
       RETAILER DASHBOARD
    ================================================================ */
    function RetailerDashboard({ t }) {

        useEffect(() => {
            fetch("/api/recommend", {
                method: "POST", headers: { "Content-Type": "application/json" },

                        {records.map((r, i) => (
                            <div key={i} className="bg-surface-800 rounded-xl p-4 border border-agri-600/30">
                                <span className="text-[10px] px-2 py-0.5 rounded-full bg-agri-950 text-agri-400 border border-agri-700">Verified Origin</span>
                                <h5 className="font-bold text-lg mt-2">{r.crop_name}</h5>
                                <p className="text-xs text-gray-400 font-mono mt-1">Batch: {r.batch_id}</p>

                <div className="glass rounded-2xl p-6">
                    <h3 className="font-bold mb-4 gradient-text">Crop Supply Browser</h3>
                    <div className="flex gap-2 flex-wrap mb-4">

                                <p className="text-sm text-gray-400">{t.profit}: <span className="text-agri-400 font-semibold">{c.expected_profit}</span></p>
                                <span className={`text-xs px-2 py-1 rounded-full font-medium ${riskColors[c.risk_level] || ''}`}>

                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );
    }

    /* ================================================================
       VOICE ASSISTANT
    ================================================================ */
    const LANG_CODES = { en: 'en-IN', hi: 'hi-IN', bn: 'bn-IN' };

    function VoiceAssistant({ lang, apiKey, t }) {
        const [open, setOpen] = useState(false);
        const [status, setStatus] = useState('idle');
        const [transcript, setTranscript] = useState('');
        const [reply, setReply] = useState('');
        const recognitionRef = useRef(null);

        const speak = useCallback((text) => {
            if (!text) return;
            setStatus('speaking');
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = LANG_CODES[lang] || 'en-IN';
            utter.rate = 0.9;
            utter.onend = () => setStatus('idle');
            utter.onerror = () => setStatus('idle');
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utter);
        }, [lang]);

        const startListening = useCallback(() => {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { setReply('Speech Recognition not supported in this browser.'); return; }
            window.speechSynthesis.cancel();
            setTranscript(''); setReply('');
            const rec = new SR();
            rec.lang = LANG_CODES[lang] || 'en-IN';
            rec.interimResults = false;
            rec.maxAlternatives = 1;
            rec.onresult = async (e) => {
                const text = e.results[0][0].transcript;
                setTranscript(text);
                setStatus('processing');
                try {
                    const res = await fetch('/api/chat', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text, api_key: apiKey }),
                    });
                    const data = await res.json();
                    setReply(data.reply);
                    speak(data.reply);
                } catch {
                    setReply('Sorry, could not reach the server.'); setStatus('idle');
                }
            };
            rec.onerror = () => setStatus('idle');
            recognitionRef.current = rec;
            rec.start();
            setStatus('listening');
        }, [lang, apiKey, speak]);

        const stopListening = () => { recognitionRef.current?.stop(); };

        const toggleListen = () => {
            if (status === 'listening') stopListening();
            else if (status === 'idle') startListening();
        };

        const statusText = { idle: t.voiceTapToSpeak, listening: t.voiceListening, processing: t.voiceProcessing, speaking: t.voiceSpeaking };
        const statusColor = { idle: 'bg-agri-600', listening: 'bg-red-500 voice-pulse', processing: 'bg-yellow-500', speaking: 'bg-blue-500' };

        return (
            <>
                <button onClick={() => setOpen(!open)}
                    className={`fixed bottom-6 left-6 z-50 w-14 h-14 rounded-full shadow-2xl
                        bg-gradient-to-br from-violet-500 to-purple-600 hover:from-violet-400 hover:to-purple-500
                        flex items-center justify-center text-2xl transition-all duration-300
                        ${open ? 'scale-90' : 'hover:scale-110'}`}>
                    {open ? '✕' : '🎙️'}
                </button>

                {open && (
                    <div className="fixed bottom-24 left-6 z-50 w-80 max-w-[calc(100vw-3rem)] glass-strong rounded-2xl p-6 animate-slide-up shadow-2xl text-center">
                        <h4 className="font-bold gradient-text mb-4 text-lg">{t.voiceTitle}</h4>
                        <button onClick={toggleListen} disabled={status === 'processing' || status === 'speaking'}
                            className={`w-24 h-24 mx-auto rounded-full flex items-center justify-center text-4xl text-white
                                transition-all duration-300 disabled:opacity-50 ${statusColor[status]}`}>
                            🎤
                        </button>
                        <p className="text-sm mt-3 text-gray-400">{statusText[status]}</p>
                        {transcript && (
                            <div className="mt-4 p-3 bg-surface-800 rounded-xl text-sm text-left">
                                <p className="text-gray-500 text-xs mb-1">You said:</p>
                                <p>{transcript}</p>
                            </div>
                        )}
                        {reply && (
                            <div className="mt-3 p-3 bg-agri-900/40 border border-agri-700/50 rounded-xl text-sm text-left">
                                <p className="text-agri-400 text-xs mb-1">AgriChain AI:</p>
                                <p className="text-gray-200 leading-relaxed">{reply}</p>
                            </div>
                        )}
                    </div>
                )}
            </>
        );
    }

    /* ================================================================
       APP ROOT
    ================================================================ */
    function App() {
        const [role, setRole] = useState(null);
        const [lang, setLang] = useState("en");
        const [apiKey, setApiKey] = useState("");
        const [showSettings, setShowSettings] = useState(false);
        const [theme, setTheme] = useState('dark');
        const [activeView, setActiveView] = useState("dashboard"); // dashboard | blockchain | digital_twin
        
        const CropSimulation = window.exports && window.exports.default ? window.exports.default : () => <div className="p-8 text-center">Loading Crop Simulation...</div>;

        const toggleTheme = useCallback(() => {
            setTheme(prev => {
                const next = prev === 'dark' ? 'light' : 'dark';
                if (next === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                return next;
            });
        }, []);

        const t = T[lang];

        if (!role) {
            return <LandingPage onSelectRole={(r) => { setRole(r); setActiveView("dashboard"); }} t={t} />;
        }

        return (
            <div className="min-h-screen flex flex-col">
                <Header role={role} lang={lang} setLang={setLang}
                    onSettings={() => setShowSettings(true)}
                    onLogout={() => { setRole(null); setActiveView("dashboard"); }}
                    theme={theme} toggleTheme={toggleTheme} t={t} 
                    activeView={activeView} setActiveView={setActiveView} />

                <main className="flex-1">
                    {activeView === "dashboard" && (
                        <>
                            {role === "Farmer"   && <FarmerDashboard role={role} t={t} />}
                            {role === "Admin"    && <AdminDashboard t={t} />}
                            {role === "Retailer" && <RetailerDashboard t={t} />}
                        </>
                    )}

                    {activeView === "blockchain" && (
                        <div className="max-w-6xl mx-auto p-6">
                            <BlockchainTab t={t} />
                        </div>
                    )}

                    {activeView === "digital_twin" && (
                        <CropSimulation />
                    )}
                </main>

                <ChatBot apiKey={apiKey} t={t} />
                <VoiceAssistant lang={lang} apiKey={apiKey} t={t} />
                <SettingsModal show={showSettings} onClose={() => setShowSettings(false)}
                    apiKey={apiKey} setApiKey={setApiKey} t={t} />
            </div>
        );
    }

    /* Mount React */
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
