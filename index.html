<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriChain — Smart Agriculture Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        agri: { 50: '#f0fdf4', 400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 900: '#14532d' },
                        surface: { 800: '#1a1f2e', 900: '#111827', 700: '#243046' }
                    }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .gradient-text { background: linear-gradient(135deg, #4ade80, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        @keyframes chatPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .chat-pop { animation: chatPop 0.3s ease-out; }
        @keyframes voicePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); } 50% { box-shadow: 0 0 0 18px rgba(239,68,68,0); } }
        .voice-pulse { animation: voicePulse 1.2s ease-in-out infinite; }
    </style>
</head>
<body class="bg-surface-900 text-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ================================================================
       HARDCODED TRANSLATION DICTIONARY (ZERO API COST)
    ================================================================ */
    const DICTIONARY = {
        en: {
            appName: "AgriChain", tagline: "Smart Agriculture Platform",
            farmer: "Farmer", admin: "Admin", retailer: "Retailer",
            welcome: "Welcome", logout: "Logout",
            dashboard: "Dashboard", farmInfo: "Farm Info", community: "Community", predictor: "Predictor",
            location: "Location (District)", soilType: "Soil Type", enterLocation: "e.g., Hooghly", selectSoil: "Select Soil...",
            recommend: "Get Recommendations", cropName: "Crop", risk: "Risk Level", riskReason: "Analysis",
            noResults: "No crops found for this district.", askQuestion: "Ask a question...", post: "Post",
            chatTitle: "AgriChain Sarvam AI", chatPlaceholder: "Ask me anything...", send: "Send",
            voiceTitle: "Voice Assistant", voiceTap: "Tap to speak", listening: "Listening...", processing: "Processing...",
            rainfall: "Rainfall", temperature: "Temperature", humidity: "Humidity",
            mandiBuy: "Mandi Buy Price", retailSell: "Retail Selling Price", calcMargin: "Calculate Margins", profitMargin: "Profit Margin"
        },
        hi: {
            appName: "एग्रीचेन", tagline: "स्मार्ट कृषि प्लेटफार्म",
            farmer: "किसान", admin: "प्रशासक", retailer: "व्यापारी",
            welcome: "स्वागत है", logout: "लॉगआउट",
            dashboard: "डैशबोर्ड", farmInfo: "खेत की जानकारी", community: "समुदाय", predictor: "भविष्यवाणी",
            location: "स्थान (जिला)", soilType: "मिट्टी का प्रकार", enterLocation: "उदा. हुगली", selectSoil: "मिट्टी चुनें...",
            recommend: "सिफारिशें प्राप्त करें", cropName: "फसल", risk: "जोखिम स्तर", riskReason: "विश्लेषण",
            noResults: "इस जिले के लिए कोई फसल नहीं मिली।", askQuestion: "एक सवाल पूछें...", post: "पोस्ट",
            chatTitle: "एग्रीचेन सर्वम AI", chatPlaceholder: "कुछ भी पूछें...", send: "भेजें",
            voiceTitle: "आवाज़ सहायक", voiceTap: "बोलने के लिए दबाएं", listening: "सुन रहा है...", processing: "प्रसंस्करण...",
            rainfall: "वर्षा", temperature: "तापमान", humidity: "आर्द्रता",
            mandiBuy: "मंडी खरीद मूल्य", retailSell: "खुदरा बिक्री मूल्य", calcMargin: "मार्जिन की गणना करें", profitMargin: "लाभ मार्जिन"
        },
        bn: {
            appName: "এগ্রিচেইন", tagline: "স্মার্ট কৃষি প্ল্যাটফর্ম",
            farmer: "কৃষক", admin: "প্রশাসক", retailer: "ব্যবসায়ী",
            welcome: "স্বাগতম", logout: "লগআউট",
            dashboard: "ড্যাশবোর্ড", farmInfo: "খামারের তথ্য", community: "সম্প্রদায়", predictor: "ভবিষ্যদ্বাণী",
            location: "অবস্থান (জেলা)", soilType: "মাটির ধরন", enterLocation: "যেমন, হুগলী", selectSoil: "মাটি নির্বাচন করুন...",
            recommend: "পরামর্শ পান", cropName: "ফসল", risk: "ঝুঁকির মাত্রা", riskReason: "বিশ্লেষণ",
            noResults: "এই জেলার জন্য কোনো ফসল পাওয়া যায়নি।", askQuestion: "একটি প্রশ্ন জিজ্ঞাসা করুন...", post: "পোস্ট",
            chatTitle: "এগ্রিচেইন সর্বম AI", chatPlaceholder: "যেকোনো কিছু জিজ্ঞাসা করুন...", send: "পাঠান",
            voiceTitle: "ভয়েস সহকারী", voiceTap: "কথা বলতে চাপুন", listening: "শুনছি...", processing: "প্রক্রিয়াকরণ...",
            rainfall: "বৃষ্টিপাত", temperature: "তাপমাত্রা", humidity: "আর্দ্রতা",
            mandiBuy: "মান্ডি ক্রয় মূল্য", retailSell: "খুচরা বিক্রয় মূল্য", calcMargin: "মার্জিন গণনা করুন", profitMargin: "লাভ মার্জিন"
        }
    };

    const LANG_CODES = { en: 'en-IN', hi: 'hi-IN', bn: 'bn-IN' };
    const LANG_LABELS = { en: "English", hi: "हिंदी", bn: "বাংলা" };

    /* ================================================================
       APP COMPONENTS
    ================================================================ */
    function FarmInfoTab({ t }) {
        const [location, setLocation] = useState("");
        const [soilType, setSoilType] = useState("");
        const [results, setResults] = useState(null);
        const [loading, setLoading] = useState(false);

        const handleRecommend = async () => {
            if (!location) return;
            setLoading(true);
            try {
                const res = await fetch("/api/recommend", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ soil_type: soilType, location }),
                });
                const data = await res.json();
                setResults(data);
            } catch (e) { console.error(e); }
            setLoading(false);
        };

        const riskColors = { Low: "text-green-400 bg-green-500/10 border-green-500", Medium: "text-yellow-400 bg-yellow-500/10 border-yellow-500", High: "text-red-400 bg-red-500/10 border-red-500" };

        return (
            <div className="space-y-6">
                <div className="glass rounded-2xl p-6">
                    <h3 className="text-lg font-bold mb-4 gradient-text">{t.farmInfo}</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label className="text-sm text-gray-400 mb-1 block">{t.location}</label>
                            <input type="text" value={location} onChange={e => setLocation(e.target.value)}
                                className="w-full bg-surface-900 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-agri-500"
                                placeholder={t.enterLocation} />
                        </div>
                        <div>
                            <label className="text-sm text-gray-400 mb-1 block">{t.soilType}</label>
                            <select value={soilType} onChange={e => setSoilType(e.target.value)}
                                className="w-full bg-surface-900 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-agri-500">
                                <option value="">{t.selectSoil}</option>
                                {["Alluvial", "Laterite", "Red Sandy", "Brown Forest"].map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                        </div>
                        <div className="flex items-end">
                            <button onClick={handleRecommend} disabled={!location || loading}
                                className="w-full bg-agri-600 hover:bg-agri-500 disabled:opacity-40 rounded-xl px-6 py-3 font-semibold transition-all">
                                {loading ? "..." : t.recommend}
                            </button>
                        </div>
                    </div>
                </div>

                {results && (
                    <div className="glass rounded-2xl p-6">
                        <h4 className="font-bold mb-4 text-agri-400">
                            {results.recommendations?.length > 0 
                                ? `${results.recommendations.length} ${t.cropName}(s) for ${results.location}`
                                : t.noResults}
                        </h4>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {results.recommendations?.map((c, i) => (
                                <div key={i} className="bg-surface-800 rounded-xl p-5 border border-gray-700/50">
                                    <div className="flex justify-between items-start mb-2">
                                        <h5 className="font-bold text-xl">{c.crop_name}</h5>
                                        <span className={`text-xs px-2 py-1 rounded-full font-medium border ${riskColors[c.risk_level] || ''}`}>
                                            {t.risk}: {c.risk_level}
                                        </span>
                                    </div>
                                    <div className="text-sm text-gray-400 mt-3 border-t border-gray-700 pt-2">
                                        <span className="font-semibold text-gray-300">{t.riskReason}:</span> {c.risk_reason}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
            </div>
        );
    }

    function CommunityTab({ role, t }) {
        const [posts, setPosts] = useState([]);
        const [question, setQuestion] = useState("");

        const load = useCallback(async () => {
            try {
                const res = await fetch("/api/forum");
                setPosts(await res.json());
            } catch (e) {}
        }, []);

        useEffect(() => { load(); }, [load]);

        const handlePost = async () => {
            if (!question.trim()) return;
            await fetch("/api/forum", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question, user_role: role }),
            });
            setQuestion("");
            load();
        };

        return (
            <div className="space-y-6">
                <div className="glass rounded-2xl p-6 flex gap-3">
                    <input type="text" value={question} onChange={e => setQuestion(e.target.value)}
                        className="flex-1 bg-surface-900 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-agri-500"
                        placeholder={t.askQuestion} />
                    <button onClick={handlePost} className="bg-agri-600 hover:bg-agri-500 rounded-xl px-6 py-3 font-semibold">
                        {t.post}
                    </button>
                </div>
                <div className="space-y-3">
                    {posts.map((p, i) => (
                        <div key={i} className="glass rounded-xl p-4">
                            <div className="flex justify-between">
                                <p className="text-gray-200">{p.question}</p>
                                <span className="text-xs px-2 py-1 rounded-full border text-agri-400 border-agri-500">{p.user_role}</span>
                            </div>
                            <p className="text-xs text-gray-500 mt-2">{p.timestamp}</p>
                        </div>
                    ))}
                </div>
            </div>
        );
    }

    function RetailerDashboard({ t }) {
        const [districts, setDistricts] = useState([]);
        const [locMap, setLocMap] = useState({});
        const [selDist, setSelDist] = useState("");
        const [selCrop, setSelCrop] = useState("");
        const [mandi, setMandi] = useState("");
        const [sell, setSell] = useState("");
        const [metrics, setMetrics] = useState(null);

        useEffect(() => {
            fetch("/api/retailer/locations").then(r => r.json()).then(d => {
                setLocMap(d); setDistricts(Object.keys(d));
            });
        }, []);

        const calc = async () => {
            const res = await fetch("/api/retailer/calculate", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ district: selDist, crop: selCrop, mandi_price: mandi, selling_price: sell })
            });
            setMetrics(await res.json());
        };

        return (
            <div className="space-y-8 animate-fade-in">
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div className="glass rounded-2xl p-6 space-y-4">
                        <select onChange={e => {setSelDist(e.target.value); setSelCrop("")}} className="w-full bg-surface-900 border border-gray-700 rounded-xl px-4 py-2">
                            <option value="">{t.location}...</option>
                            {districts.map(d => <option key={d}>{d}</option>)}
                        </select>
                        <select value={selCrop} onChange={e => setSelCrop(e.target.value)} disabled={!selDist} className="w-full bg-surface-900 border border-gray-700 rounded-xl px-4 py-2 disabled:opacity-50">
                            <option value="">{t.cropName}...</option>
                            {(locMap[selDist] || []).map(c => <option key={c}>{c}</option>)}
                        </select>
                        <input type="number" placeholder={t.mandiBuy} value={mandi} onChange={e => setMandi(e.target.value)} className="w-full bg-surface-900 border border-gray-700 rounded-xl px-4 py-2" />
                        <input type="number" placeholder={t.retailSell} value={sell} onChange={e => setSell(e.target.value)} className="w-full bg-surface-900 border border-gray-700 rounded-xl px-4 py-2" />
                        <button onClick={calc} className="w-full bg-agri-600 rounded-xl py-3 font-semibold">{t.calcMargin}</button>
                    </div>
                    {metrics && (
                        <div className="glass rounded-2xl p-6 border-cyan-500/20">
                            <h4 className="text-xl font-bold">{metrics.crop} | {metrics.district}</h4>
                            <div className="mt-4 p-4 bg-surface-800 rounded-xl">
                                <p className="text-gray-400">{t.profitMargin}:</p>
                                <p className={`text-3xl font-black ${metrics.profit_margin_pct >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                    {metrics.profit_margin_pct}%
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            </div>
        );
    }

    function ChatBot({ lang, t }) {
        const [open, setOpen] = useState(false);
        const [msgs, setMsgs] = useState([{ role: "bot", text: "Namaste! I am AgriChain AI." }]);
        const [inp, setInp] = useState("");

        const send = async () => {
            if (!inp) return;
            const uMsg = inp;
            setInp("");
            setMsgs(p => [...p, { role: "user", text: uMsg }]);
            try {
                const res = await fetch("/api/chat", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: uMsg, lang: LANG_CODES[lang] })
                });
                const d = await res.json();
                setMsgs(p => [...p, { role: "bot", text: d.reply }]);
            } catch(e) {}
        };

        return (
            <>
                <button onClick={() => setOpen(!open)} className="fixed bottom-6 right-6 z-50 w-14 h-14 rounded-full bg-agri-600 text-2xl">💬</button>
                {open && (
                    <div className="fixed bottom-24 right-6 w-80 h-96 glass-strong rounded-2xl flex flex-col p-4">
                        <h4 className="font-bold border-b border-gray-700 pb-2">{t.chatTitle} (Sarvam)</h4>
                        <div className="flex-1 overflow-y-auto py-2 space-y-2">
                            {msgs.map((m, i) => (
                                <div key={i} className={`p-2 rounded-xl text-sm ${m.role === 'user' ? 'bg-agri-600 ml-auto' : 'bg-surface-800'} max-w-[85%]`}>
                                    {m.text}
                                </div>
                            ))}
                        </div>
                        <div className="flex gap-2 pt-2 border-t border-gray-700">
                            <input value={inp} onChange={e => setInp(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} className="flex-1 bg-surface-900 px-3 py-2 rounded-lg text-sm" placeholder={t.chatPlaceholder} />
                            <button onClick={send} className="bg-agri-600 px-3 py-2 rounded-lg text-sm">{t.send}</button>
                        </div>
                    </div>
                )}
            </>
        );
    }

    function VoiceAssistant({ lang, t }) {
        const [open, setOpen] = useState(false);
        const [status, setStatus] = useState('idle');
        const [transcript, setTranscript] = useState('');
        const [reply, setReply] = useState('');

        const start = () => {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) return;
            const rec = new SR();
            rec.lang = LANG_CODES[lang];
            rec.onresult = async (e) => {
                const text = e.results[0][0].transcript;
                setTranscript(text);
                setStatus('processing');
                const res = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ message: text, lang: LANG_CODES[lang] }) });
                const data = await res.json();
                setReply(data.reply);
                setStatus('idle');
                const utter = new SpeechSynthesisUtterance(data.reply);
                utter.lang = LANG_CODES[lang];
                window.speechSynthesis.speak(utter);
            };
            rec.start();
            setStatus('listening');
        };

        const statusColor = { idle: 'bg-agri-600', listening: 'bg-red-500 voice-pulse', processing: 'bg-yellow-500' };

        return (
            <>
                <button onClick={() => setOpen(!open)} className="fixed bottom-6 left-6 z-50 w-14 h-14 rounded-full bg-purple-600 text-2xl">🎙️</button>
                {open && (
                    <div className="fixed bottom-24 left-6 w-72 glass-strong rounded-2xl p-6 text-center">
                        <h4 className="font-bold mb-4">{t.voiceTitle}</h4>
                        <button onClick={start} className={`w-20 h-20 mx-auto rounded-full text-3xl ${statusColor[status]}`}>🎤</button>
                        <p className="text-xs mt-3 text-gray-400">{status === 'idle' ? t.voiceTap : (status === 'listening' ? t.listening : t.processing)}</p>
                        {transcript && <p className="mt-3 text-xs bg-surface-800 p-2 rounded">{transcript}</p>}
                        {reply && <p className="mt-2 text-xs bg-agri-900 p-2 rounded text-agri-400">{reply}</p>}
                    </div>
                )}
            </>
        );
    }

    function App() {
        const [role, setRole] = useState(null);
        const [lang, setLang] = useState("en");
        const [tab, setTab] = useState("farm");
        
        const t = DICTIONARY[lang];

        if (!role) {
            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                    <h1 className="text-5xl font-black gradient-text mb-8">{t.appName}</h1>
                    <div className="flex gap-4 mb-8">
                        {Object.keys(LANG_LABELS).map(l => (
                            <button key={l} onClick={() => setLang(l)}
                                className={`px-4 py-2 rounded-xl text-sm font-semibold border ${lang === l ? 'bg-agri-600 border-agri-500' : 'border-gray-700'}`}>
                                {LANG_LABELS[l]}
                            </button>
                        ))}
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 max-w-3xl w-full">
                        {["Farmer", "Admin", "Retailer"].map(r => (
                            <button key={r} onClick={() => setRole(r)} className="glass p-6 rounded-2xl hover:scale-105 transition">
                                <h3 className="text-xl font-bold">{t[r.toLowerCase()]}</h3>
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        return (
            <div className="min-h-screen p-6 max-w-6xl mx-auto">
                <header className="flex justify-between items-center mb-8 glass p-4 rounded-2xl">
                    <h2 className="text-xl font-bold gradient-text">{t.welcome}, {t[role.toLowerCase()]}</h2>
                    <div className="flex gap-4">
                        <select value={lang} onChange={e => setLang(e.target.value)} className="bg-surface-900 border border-gray-700 rounded-lg px-2 text-sm">
                            <option value="en">English</option>
                            <option value="hi">हिंदी</option>
                            <option value="bn">বাংলা</option>
                        </select>
                        <button onClick={() => setRole(null)} className="text-red-400 hover:text-red-300 text-sm">{t.logout}</button>
                    </div>
                </header>

                <div className="flex gap-2 mb-6 bg-surface-800 rounded-xl p-1.5 w-fit">
                    {role === "Farmer" && <button onClick={() => setTab("farm")} className={`px-4 py-2 rounded-lg text-sm ${tab === 'farm' ? 'bg-agri-600' : ''}`}>{t.farmInfo}</button>}
                    {role === "Farmer" && <button onClick={() => setTab("community")} className={`px-4 py-2 rounded-lg text-sm ${tab === 'community' ? 'bg-agri-600' : ''}`}>{t.community}</button>}
                </div>

                {role === "Farmer" && tab === "farm" && <FarmInfoTab t={t} />}
                {role === "Farmer" && tab === "community" && <CommunityTab role={role} t={t} />}
                {role === "Retailer" && <RetailerDashboard t={t} />}
                
                <ChatBot lang={lang} t={t} />
                <VoiceAssistant lang={lang} t={t} />
            </div>
        );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
